[package]
name = "deepseek-code"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A personal experiment: a small coding agent for DeepSeek models, sandboxed with nanosandbox"
repository = "https://github.com/Erio-Harrison/deepseek-code"

[lib]
name = "deepseek_code"
path = "src/lib.rs"

[[bin]]
name = "deepseek-code"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
nanosandbox = "0.3.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
